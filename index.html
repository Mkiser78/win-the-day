<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Win the Day</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Social Preview -->
<meta property="og:title" content="Win the Day | Men's Mental Strength Movement">
<meta property="og:description" content="Building strength, connection, and resilience in men. Stand shoulder to shoulder. Win the Day — Together.">
<meta property="og:image" content="https://wintheday.site/social-preview.png">
<meta property="og:url" content="https://wintheday.site/">
<meta property="og:type" content="website">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- PROFESSIONAL FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
html, body {
  margin:0;
  padding:0;
  font-family:'Inter', sans-serif;
  background:black;
  color:white;
  scroll-behavior:smooth;
}

/* HEADINGS USE MONTSERRAT */
h1, h2, h3, .title {
  font-family:'Montserrat', sans-serif;
}

/* NAV */
nav {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 40px;
  background:black;
}

.nav-logo img { height:70px; }

.nav-links {
  display:flex;
  align-items:center;
}

.nav-links a {
  position:relative;
  color:#facc15;
  margin-left:30px;
  text-decoration:none;
  font-weight:bold;
}

.nav-links a::after {
  content:"";
  position:absolute;
  left:0;
  bottom:-4px;
  width:0%;
  height:3px;
  background:#16a34a;
  transition:0.3s ease;
}

.nav-links a:hover::after,
.nav-links a.active::after {
  width:100%;
}

/* HERO */
.hero {
  position:relative;
  height:90vh;
  background:url("hero.jpg") center/cover no-repeat;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero::before {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(rgba(0,0,0,0.88), rgba(0,0,0,0.65));
}

.hero-content {
  position:relative;
  z-index:2;
  max-width:850px;
  padding:20px;
}

.hero-logo { height:190px; margin-bottom:25px; }

.statement { font-size:18px; letter-spacing:3px; font-weight:600; }
.title { font-size:58px; font-weight:900; margin:10px 0; }
.subtext { font-size:21px; line-height:1.7; }

.button {
  display:inline-block;
  margin-top:35px;
  padding:16px 45px;
  background:#16a34a;
  color:white;
  text-decoration:none;
  font-weight:600;
  border-radius:8px;
  transition:0.3s;
}

.button:hover { transform:scale(1.05); }

/* SECTIONS */
section {
  padding:100px 20px;
  text-align:center;
}

.section-dark { background:#0f0f0f; }
.section-darker { background:#111; }

h2 {
  font-size:40px;
  margin-bottom:30px;
  color:#facc15;
}

/* FEATURED */
.feature-box {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:60px;
  flex-wrap:wrap;
}

.feature-box img {
  width:320px;
  border-radius:14px;
}

.feature-details {
  max-width:500px;
  text-align:left;
}

/* FIRST TIME */
.first-time-box {
  max-width:700px;
  margin:0 auto;
  font-size:22px;
  line-height:1.9;
}

.first-time-close {
  margin-top:40px;
  font-size:20px;
  opacity:0.85;
}

/* EVENTS */
.event-card {
  background:#1a1a1a;
  padding:30px;
  margin:25px auto;
  max-width:720px;
  border-radius:10px;
  border-left:4px solid #16a34a;
  text-align:left;
}

/* GET INVOLVED */
.involved-grid {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:30px;
  margin-top:40px;
}

.involved-card {
  background:#111;
  padding:30px;
  max-width:320px;
  border-radius:10px;
  text-align:left;
}

.involved-card h3 { color:#facc15; }

/* SOCIAL */
.social-links {
  text-align:center;
  margin:40px 0;
}

.social-links a {
  color:#facc15;
  font-size:32px;
  margin:0 18px;
}

/* FOOTER */
footer {
  background:black;
  padding:30px 20px;
  text-align:center;
  font-size:14px;
}

/* MOBILE */
@media(max-width:768px){
  nav { flex-direction:column; padding:20px; }
  .nav-logo { margin-bottom:15px; }
  .nav-links { flex-wrap:wrap; justify-content:center; gap:12px 20px; }
  .nav-links a { margin:0; font-size:16px; }
  .title{font-size:38px;}
  .hero-logo{height:160px;}
  .feature-box{flex-direction:column;}
}
</style>
</head>

<body>

<nav>
  <div class="nav-logo">
    <a href="index.html"><img src="logo.png"></a>
  </div>
  <div class="nav-links">
    <a href="index.html" class="active">Home</a>
    <a href="mission.html">Mission</a>
    <a href="#events">Events</a>
    <a href="#get-involved">Get Involved</a>
    <a href="merch.html">Shop</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<!-- KEEP YOUR EXISTING SECTIONS BELOW EXACTLY AS THEY WERE -->

</body>
</html>
