<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Win the Day</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:title" content="Win the Day | Men's Mental Strength Movement">
<meta property="og:description" content="Building strength, connection, and resilience in men. Stand shoulder to shoulder. Win the Day — Together.">
<meta property="og:image" content="https://wintheday.site/social-preview.png">
<meta property="og:url" content="https://wintheday.site/">
<meta property="og:type" content="website">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
html, body {
  margin:0;
  padding:0;
  font-family:'Inter', sans-serif;
  background: radial-gradient(circle at top center, #111 0%, #000 65%);
  color:white;
  scroll-behavior:smooth;
}

h1, h2, h3, .title {
  font-family:'Montserrat', sans-serif;
}

/* REVEAL DISABLED — INSTANT LOAD */
.reveal {
  opacity:1;
  transform:none;
  transition:none;
}

/* NAV */
nav {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 40px;
  background:transparent;
}

.nav-logo img { height:70px; }

.nav-links {
  display:flex;
  align-items:center;
}

.nav-links a {
  position:relative;
  color:#facc15;
  margin-left:30px;
  text-decoration:none;
  font-weight:600;
}

.nav-links a::after {
  content:"";
  position:absolute;
  left:0;
  bottom:-4px;
  width:0%;
  height:3px;
  background:#16a34a;
  transition:0.3s ease;
}

.nav-links a:hover::after,
.nav-links a.active::after {
  width:100%;
}

/* HERO */
.hero {
  position:relative;
  height:90vh;
  background:url("hero.jpg") center/cover no-repeat;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero::before {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.75));
}

.hero-content {
  position:relative;
  z-index:2;
  max-width:850px;
  padding:20px;
}

.hero-logo { height:190px; margin-bottom:25px; }

.statement {
  font-size:16px;
  letter-spacing:4px;
  opacity:0.8;
  font-weight:600;
}

.title {
  font-size:64px;
  font-weight:900;
  margin:15px 0;
}

.subtext {
  font-size:21px;
  line-height:1.7;
}

.button {
  display:inline-block;
  margin-top:35px;
  padding:16px 50px;
  background:#16a34a;
  color:white;
  text-decoration:none;
  font-weight:600;
  border-radius:50px;
  transition:all 0.3s ease;
  box-shadow:0 8px 20px rgba(0,0,0,0.4);
}

.button:hover {
  transform:translateY(-5px);
  box-shadow:0 15px 35px rgba(22,163,74,0.4);
}

/* WHY */
.why-exist {
  background:#111;
  padding:100px 20px;
  border-bottom:1px solid #1c1c1c;
}

/* IMPACT STRIP */
.impact-strip {
  background:#0f0f0f;
  padding:60px 20px;
  border-bottom:1px solid #1c1c1c;
}

.impact-grid {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:60px;
  text-align:center;
}

.impact-item h3 {
  font-size:42px;
  color:#16a34a;
  margin-bottom:10px;
}

.impact-item p {
  font-size:14px;
  letter-spacing:2px;
  text-transform:uppercase;
  opacity:0.7;
}

/* NEXT MEETING */
.next-meeting {
  background:#0f0f0f;
  padding:40px 20px;
  border-top:4px solid #16a34a;
  border-bottom:1px solid #1c1c1c;
}

/* SECTIONS */
section {
  padding:100px 20px;
  text-align:center;
  border-bottom:1px solid #1c1c1c;
}

.section-dark { background:#0f0f0f; }
.section-darker { background:#111; }

h2 {
  font-size:40px;
  margin-bottom:30px;
  color:#facc15;
}

/* FEATURED */
.featured-badge {
  display:inline-block;
  background:#16a34a;
  padding:6px 18px;
  border-radius:50px;
  font-size:12px;
  letter-spacing:1px;
  margin-bottom:20px;
}

.feature-box {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:60px;
  flex-wrap:wrap;
}

.feature-box img {
  width:340px;
  border-radius:16px;
  box-shadow:0 0 40px rgba(22,163,74,0.3);
}

.feature-details {
  max-width:500px;
  text-align:left;
}

/* FIRST TIME */
.first-time-box {
  max-width:700px;
  margin:0 auto;
  font-size:22px;
  line-height:1.9;
}

/* EVENTS */
.event-card {
  background:#1a1a1a;
  padding:30px;
  margin:25px auto;
  max-width:720px;
  border-radius:10px;
  border-left:4px solid #16a34a;
  text-align:left;
  transition:0.3s ease;
}

.event-card:hover {
  transform:translateY(-6px);
  box-shadow:0 15px 35px rgba(0,0,0,0.5);
}

/* GET INVOLVED */
.involved-grid {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:30px;
}

.involved-card {
  background:#111;
  padding:30px;
  max-width:320px;
  border-radius:10px;
  text-align:left;
  transition:0.3s ease;
}

.involved-card:hover {
  transform:translateY(-6px);
  box-shadow:0 15px 35px rgba(0,0,0,0.5);
}

.involved-card h3 { color:#facc15; }

/* SOCIAL */
.social-links {
  text-align:center;
  margin:40px 0;
}

.social-links a {
  color:#facc15;
  font-size:32px;
  margin:0 18px;
  transition:0.3s;
}

.social-links a:hover {
  transform:scale(1.2);
  color:#16a34a;
}

/* FOOTER */
footer {
  padding:30px 20px;
  text-align:center;
  font-size:14px;
}

/* MOBILE */
@media(max-width:768px){
  nav { flex-direction:column; padding:20px; }
  .nav-links { flex-wrap:wrap; justify-content:center; gap:12px 20px; }
  .title{font-size:38px;}
  .hero-logo{height:160px;}
  .feature-box{flex-direction:column;}
}
</style>
</head>

<body>

    <a href="mission.html">Mission</a>
    <a href="#events">Events</a>
    <a href="#get-involved">Get Involved</a>
    <a href="merch.html">Shop</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

</body>
</html>
